services:
  # ── Web API ────────────────────────────────────────────────────────────────
  - type: web
    name: congress-trades-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Single worker (gunicorn default): in-process caches and rate limits are shared by all requests
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker backend.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: RENDER
        value: true          # disables APScheduler (cron jobs handle it)
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in Render dashboard
      - key: BLOCKED_IPS
        sync: false          # comma-separated IPs answered with 403

  # ── Cron Jobs ──────────────────────────────────────────────────────────────
  # Times are UTC. ET = UTC-5 (winter) / UTC-4 (summer).
  # These run even when the web service is sleeping.

  - type: cron
    name: senate-scraper
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python crons/senate_scrape.py
    schedule: "0 7 * * *"   # 02:00 ET (winter)
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: house-scraper
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python crons/house_scrape.py
    schedule: "0 8 * * *"   # 03:00 ET (winter)
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: quiverquant-scraper
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python crons/quiverquant_scrape.py
    schedule: "30 8 * * *"  # 03:30 ET (winter)
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: price-refresh
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python crons/refresh_prices.py
    schedule: "0 11 * * *"  # 06:00 ET (daily, after scrapers finish)
    envVars:
      - key: DATABASE_URL
        sync: false
