<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Congress Stock Trades</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js" defer></script>
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="leaderboard.html">Congress<span>Trades</span></a>
    <div class="d-flex gap-1">
      <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      <a class="nav-link active" href="index.html">Transactions</a>
      <a class="nav-link" href="timeseries.html">Time Series</a>
      <a class="nav-link" href="monthlychar.html">Bar Chart</a>
      <a class="nav-link" href="portfolio.html">Portfolio</a>
    </div>
  </div>
</nav>

<main class="container my-4">

  <!-- Status / Error -->
  <div id="status" class="alert alert-danger d-none mb-3" role="alert"></div>

  <!-- Loading -->
  <div id="loading" class="d-none mb-3">
    <div class="d-flex align-items-center gap-2">
      <div class="spinner-border" role="status"></div>
      <span class="small text-secondary">Loading…</span>
    </div>
  </div>

  <!-- ── Stats row ─────────────────────────────────────────────────────── -->
  <div class="row g-3 mb-4" id="statsRow">
    <div class="col-6 col-md-3">
      <div class="stat-card info">
        <div class="stat-label">Total Transactions</div>
        <div class="stat-value" id="statTotal">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card info">
        <div class="stat-label">Members Tracked</div>
        <div class="stat-value" id="statMembers">—</div>
        <div class="stat-sub" id="statMembersSub"></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card buy">
        <div class="stat-label">Total Buys</div>
        <div class="stat-value" id="statBuys">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card sell">
        <div class="stat-label">Total Sells</div>
        <div class="stat-value" id="statSells">—</div>
      </div>
    </div>
  </div>

  <!-- ── Filters ───────────────────────────────────────────────────────── -->
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-end">

        <div class="col-12 col-md-3">
          <label class="form-label">Chamber</label>
          <select id="chamberSelect" class="form-select">
            <option value="">All Chambers</option>
            <option value="Senate">Senate</option>
            <option value="House">House</option>
          </select>
        </div>

        <div class="col-12 col-md-3">
          <label class="form-label">Member</label>
          <select id="senatorSelect" class="form-select">
            <option value="">All Members</option>
          </select>
        </div>

        <div class="col-12 col-md-2">
          <label class="form-label">Ticker</label>
          <select id="tickerSelectIndex" placeholder="Search…"></select>
        </div>

        <div class="col-12 col-md-2">
          <label class="form-label">Side</label>
          <select id="sideSelect" class="form-select">
            <option value="">All</option>
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
          </select>
        </div>

        <div class="col-12 col-md-2 d-grid">
          <button id="loadBtn" class="btn btn-primary">Load</button>
        </div>
      </div>

      <!-- Pagination row -->
      <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mt-3">
        <div class="text-secondary small" id="pageInfo">Page 1</div>
        <div class="btn-group">
          <button id="prevBtn" class="btn btn-outline-secondary btn-sm">← Prev</button>
          <button id="nextBtn" class="btn btn-outline-secondary btn-sm">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Table ─────────────────────────────────────────────────────────── -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table id="transactionsTable" class="table table-striped table-hover mb-0 align-middle">
          <thead class="sticky-top">
            <tr>
              <th>Member</th>
              <th>Chamber</th>
              <th>Ticker</th>
              <th>Side</th>
              <th>Trade Date</th>
              <th>Disclosed</th>
              <th class="text-end">Est. Amount</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>

</body>
</html>
