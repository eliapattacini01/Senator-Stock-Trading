<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Top Tickers — Senator Trades</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black border-bottom border-secondary">
  <div class="container">
    <a class="navbar-brand" href="index.html">← Back</a>
    <span class="navbar-text">Top Tickers by Period</span>
  </div>
</nav>

<main class="container my-4">
  <div id="status" class="alert alert-danger d-none"></div>

  <div id="loading" class="d-none mb-3">
    <div class="d-flex align-items-center gap-2">
      <div class="spinner-border" role="status" aria-label="Loading"></div>
      <div class="fw-semibold">Loading…</div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-12 col-md-4">
      <div class="card summary-card">
        <div class="card-body">
          <div class="summary-label">Buckets loaded</div>
          <div id="bucketCountValue" class="summary-value">—</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card summary-card">
        <div class="card-body">
          <div class="summary-label">Visible tickers</div>
          <div id="visibleTickersValue" class="summary-value">—</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card summary-card">
        <div class="card-body">
          <div class="summary-label">Current metric max</div>
          <div id="metricPeakValue" class="summary-value">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-2">
          <label class="form-label">Period</label>
          <select id="periodSelect" class="form-select">
            <option value="week">Weekly</option>
            <option value="month">Monthly</option>
            <option value="year">Yearly</option>
          </select>
        </div>

        <div class="col-12 col-md-2">
          <label class="form-label">Side</label>
          <select id="sideAggSelect" class="form-select">
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
          </select>
        </div>

        <div class="col-12 col-md-3">
          <label class="form-label">Metric</label>
          <select id="metricSelect" class="form-select">
            <option value="n_senators">Unique senators</option>
            <option value="n_trades">Trades</option>
            <option value="total_estimate">Estimated amount</option>
          </select>
        </div>

        <div class="col-12 col-md-2">
          <label class="form-label">Top N</label>
          <select id="topNSelect" class="form-select">
            <option value="5">Top 5</option>
            <option value="10" selected>Top 10</option>
            <option value="15">Top 15</option>
            <option value="20">Top 20</option>
          </select>
        </div>

        <div class="col-12 col-md-3 d-grid">
          <button id="loadChartBtn" class="btn btn-outline-primary">Reload data</button>
        </div>
      </div>

      <div class="row g-2 mt-2">
        <div class="col-12 col-md-6">
          <label class="form-label">Bucket</label>
          <select id="bucketSelect" class="form-select"></select>
        </div>
        <div class="col-12 col-md-6 text-secondary small d-flex align-items-end">
          Compare top tickers by the selected metric for one time bucket.
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <canvas id="topTickersChart" height="120"></canvas>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="monthlychar.js"></script>

</body>
</html>
