<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Charts — CongressTrades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="charts-page">

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="leaderboard.html">Congress<span>Trades</span></a>
    <div class="d-flex gap-1 align-items-center">
      <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      <a class="nav-link" href="index.html">All Trades</a>
      <a class="nav-link active" href="charts.html">Charts</a>
      <a class="nav-link" href="portfolio.html">Portfolio</a>
      <a class="nav-link chat-btn" href="chat.html">Ask AI</a>
    </div>
  </div>
</nav>

<main class="container my-4">

  <div id="status" class="alert alert-danger d-none"></div>
  <div id="loading" class="d-none mb-3">
    <div class="d-flex align-items-center gap-2">
      <div class="spinner-border" role="status" aria-label="Loading"></div>
      <div class="fw-semibold">Loading…</div>
    </div>
  </div>

  <!-- Tab buttons -->
  <ul class="nav nav-tabs mb-4" id="chartTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="timeseries-tab" data-bs-toggle="tab"
              data-bs-target="#timeseries-pane" type="button" role="tab">
        Trading Volume
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="monthly-tab" data-bs-toggle="tab"
              data-bs-target="#monthly-pane" type="button" role="tab">
        Monthly Activity
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ── Tab 1: Trading Volume (timeseries) ──────────────────────────── -->
    <div class="tab-pane fade show active" id="timeseries-pane" role="tabpanel">

      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-6">
              <label class="form-label">Ticker</label>
              <select id="tickerSelect" class="form-select"></select>
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label">Mode</label>
              <select id="modeSelect" class="form-select">
                <option value="both">BUY + SELL</option>
                <option value="buy">BUY only</option>
                <option value="sell">SELL only</option>
              </select>
            </div>
            <div class="col-12 col-md-3 d-grid">
              <button id="loadBtn" class="btn btn-primary">Load chart</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <canvas id="tsChart" height="120"></canvas>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table id="transactionsTable" class="table table-striped table-hover mb-0 align-middle">
              <thead class="table-dark sticky-top">
                <tr>
                  <th>Member</th>
                  <th>Ticker</th>
                  <th>Side</th>
                  <th>Date</th>
                  <th class="text-end">Amount</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Tab 2: Monthly Activity (barchart) ─────────────────────────── -->
    <div class="tab-pane fade" id="monthly-pane" role="tabpanel">

      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="d-flex flex-wrap gap-2 align-items-end justify-content-between">
            <div class="d-flex flex-wrap gap-2 align-items-end">
              <div>
                <label class="form-label">Period</label>
                <select id="periodSelect" class="form-select">
                  <option value="week">Weekly</option>
                  <option value="month">Monthly</option>
                  <option value="year">Yearly</option>
                </select>
              </div>
              <div>
                <label class="form-label">Side</label>
                <select id="sideAggSelect" class="form-select">
                  <option value="BUY">BUY</option>
                  <option value="SELL">SELL</option>
                </select>
              </div>
              <div>
                <label class="form-label">Bucket</label>
                <select id="bucketSelect" class="form-select"></select>
              </div>
              <div class="d-grid">
                <button id="loadChartBtn" class="btn btn-outline-primary">Load Chart</button>
              </div>
            </div>
            <div class="text-secondary small">Top tickers by <b># unique members</b></div>
          </div>
          <div class="mt-3">
            <canvas id="topTickersChart" height="120"></canvas>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="timeseries.js"></script>
<script src="barchart.js"></script>
<script>
  // Initialize monthly activity tab lazily (first time it is shown)
  let _bcTabLoaded = false;
  document.getElementById("monthly-tab").addEventListener("shown.bs.tab", function () {
    if (!_bcTabLoaded) {
      _bcTabLoaded = true;
      loadChart();
    } else if (_bcChart) {
      _bcChart.resize();
    }
  });
</script>

</body>
</html>
